name: Check student workspace

on:
  push:
    branches: [main, free-browser-nodejs]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check browser-node.js
          node --check app.js
          node --check assignments.js
          node --check tests/smoke.mjs
          node --check tests/input.mjs
      - name: Run curriculum and interface smoke checks
        run: |
          node tests/smoke.mjs
          node tests/input.mjs
      - name: Build Cloudflare Pages website
        run: npm run build
      - name: Check isolation headers in deployable output
        run: |
          test -f dist/index.html
          test -f dist/_headers
          grep -q "Cross-Origin-Opener-Policy: same-origin" dist/_headers
          grep -q "Cross-Origin-Embedder-Policy: require-corp" dist/_headers
