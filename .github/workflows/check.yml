name: Check student workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check browser-runner.js
          node --check assignments.js
          node --check github-config.js
          node --check github-first.mjs
          node --check github-worker.mjs
          node --check tests/github-first.mjs
          node --check grading-examples/csf-user-input/grader.mjs
          node --check tests/smoke.mjs
          node --check tests/input.mjs
      - name: Run curriculum and interface smoke checks
        run: |
          node tests/smoke.mjs
          node tests/input.mjs
          node tests/github-first.mjs
      - name: Test Node.js backend health endpoint
        run: |
          node --check backend/server.js
          node --check backend/test/server.test.js
          cd backend
          npm test
