name: Check student workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check assignments.js
          node --check tests/smoke.mjs
          node --check tests/input.mjs
      - name: Run curriculum and interface smoke checks
        run: |
          node tests/smoke.mjs
          node tests/input.mjs
