name: Keep Render backend warm

# Render Free services can sleep after 15 minutes without incoming traffic.
# Pings every 10 minutes, offset from the start of each hour.
# GitHub's scheduler is best-effort; delayed runs may still allow the service to sleep.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-health-ping
  cancel-in-progress: false

jobs:
  health-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 12 \
            --max-time 90 \
            --retry 1 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://mrtullyclass-backend.onrender.com/health" \
            | python3 -c 'import json, sys; response = json.load(sys.stdin); assert response.get("status") == "ok" and response.get("service") == "MrTullyClass Backend", "Unexpected health response"; print("Render health check OK; codeExecutionEnabled:", response.get("codeExecutionEnabled"))'
